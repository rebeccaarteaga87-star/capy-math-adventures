<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e6d9ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Capy Math"><title>Capy Math Adventures</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#33264e;background:#faf6ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f2e9ff,#fff8ed);min-height:100dvh}.wrap{max-width:670px;margin:auto;padding:24px 17px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:white;border:2px solid #e2d2fa;padding:10px 14px;border-radius:30px;font-weight:800}.hero{text-align:center;padding:24px 5px 8px}.capy{font-size:74px;line-height:1.2}.hero h1{font-size:clamp(30px,7vw,43px);margin:8px 0;color:#5e3d95}.sub{font-size:16px;color:#665878;line-height:1.5}.panel{background:#fff;border:2px solid #eadbfa;border-radius:25px;padding:22px;margin-top:18px;box-shadow:0 8px 0 #e9def7}.quest{width:100%;text-align:left;display:flex;align-items:center;gap:15px;border:2px solid #e5d9f5;background:#fff;border-radius:19px;padding:16px;margin:12px 0;cursor:pointer;color:#34254d}.quest .emoji{font-size:39px}.quest strong{display:block;font-size:19px}.quest small{font-size:13px;color:#6d607a}.quest .arrow{margin-left:auto;font-size:23px;color:#8864c4}.btn{border:0;border-radius:17px;padding:15px 20px;font-weight:800;font-size:17px;background:#7551b6;color:white;cursor:pointer;min-height:52px}.btn:disabled{opacity:.45}.btn.secondary{background:#f0e7ff;color:#563888}.btn:active,.choice:active{transform:scale(.98)}.question{font-size:28px;font-weight:850;text-align:center;margin:20px 0 10px}.translation{text-align:center;color:#69577f;font-size:17px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:25px 0}.choice{background:#f8f2ff;border:2px solid #dcc7f6;border-radius:18px;min-height:75px;font-size:25px;font-weight:850;color:#49336c;cursor:pointer}.choice:disabled{opacity:.75}.choice.correct{background:#dbf7dc;border-color:#56a765}.choice.wrong{background:#ffe2e4;border-color:#e78893}.message{padding:16px;border-radius:15px;background:#f5effe;line-height:1.5;margin:12px 0}.progress{height:12px;border-radius:30px;background:#efe5f7;overflow:hidden;margin:13px 0}.bar{height:100%;background:#9c79db;transition:width .25s}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#796d86;font-size:14px}.hidden{display:none}.foot{text-align:center;font-size:12px;color:#877b94;margin-top:30px}button:focus-visible{outline:3px solid #4b2685;outline-offset:3px}</style></head><body><main class="wrap"><div class="top"><span class="pill">🦫 Capy Math</span><span class="pill" id="stars">⭐ 0 stars</span></div><section id="home"><div class="hero"><div class="capy">🦫🌼</div><h1>Capy Math Adventures</h1><div class="sub">Little steps, big discoveries!<br>¡Pasitos pequeños, grandes descubrimientos!</div></div><div class="panel"><h2>Choose your adventure! 🗺️</h2><div class="muted">¡Elige tu aventura!</div><div id="quests"></div></div><p class="foot">No timers. Take your time! · Sin cronómetro. ¡Tómate tu tiempo!</p></section><section id="game" class="hidden"><div class="panel"><div class="row"><button class="btn secondary" id="back">← Quests</button><strong id="questName"></strong></div><div class="progress"><div id="bar" class="bar" style="width:0%"></div></div><div class="row muted"><span id="step"></span><span>⭐ <span id="sessionStars">0</span></span></div><div class="hero"><div class="capy" id="face">🦫</div></div><div class="question" id="question"></div><div class="translation" id="translation"></div><div class="answers" id="answers"></div><div id="message" class="message hidden" role="status"></div><div class="row"><button class="btn secondary" id="hint">💡 Hint / Pista</button><button class="btn hidden" id="next">Next →</button></div></div></section><section id="finish" class="hidden"><div class="panel" style="text-align:center"><div class="capy">🦫🏆</div><h1>Quest complete!</h1><h2>¡Aventura completada!</h2><p id="result"></p><button class="btn" id="again">Choose another quest / Otra aventura</button></div></section></main><script>
const quests=[{name:'Multiplication Meadow',es:'Pradera de multiplicación',emoji:'🌼',kind:'multiply',description:'Practice multiplication / Practica la multiplicación'},{name:'Place Value Forest',es:'Bosque del valor posicional',emoji:'🌳',kind:'place',description:'Find digit values / Encuentra el valor de las cifras'},{name:'Rounding River',es:'Río del redondeo',emoji:'🏞️',kind:'round',description:'Round numbers / Redondea números'}];
const questions={multiply:[{q:'7 × 8 = ?',es:'¿Cuánto es 7 × 8?',a:56,opts:[54,56,64,48],hint:'Think: 7 × 4 = 28, then double it. / Piensa: 7 × 4 = 28 y luego duplícalo.',why:'7 groups of 8 make 56. / 7 grupos de 8 son 56.'},{q:'6 × 9 = ?',es:'¿Cuánto es 6 × 9?',a:54,opts:[45,54,56,63],hint:'6 × 10 = 60; subtract 6. / 6 × 10 = 60; resta 6.',why:'60 − 6 = 54.'},{q:'12 × 4 = ?',es:'¿Cuánto es 12 × 4?',a:48,opts:[36,44,48,52],hint:'(10 × 4) + (2 × 4). / Separa 12 en 10 y 2.',why:'40 + 8 = 48.'},{q:'8 × 7 = ?',es:'¿Cuánto es 8 × 7?',a:56,opts:[49,54,56,63],hint:'8 × 5 plus 8 × 2. / Multiplica 8 × 5 y 8 × 2.',why:'40 + 16 = 56.'},{q:'23 × 3 = ?',es:'¿Cuánto es 23 × 3?',a:69,opts:[66,69,63,79],hint:'(20 × 3) + (3 × 3). / Separa por valor posicional.',why:'60 + 9 = 69.'}],place:[{q:'Value of 5 in 352,841?',es:'¿Cuál es el valor del 5 en 352,841?',a:50000,opts:[500,5000,50000,500000],hint:'The 5 is in the ten-thousands place. / El 5 está en las decenas de millar.',why:'5 × 10,000 = 50,000.'},{q:'Value of 7 in 478,209?',es:'¿Cuál es el valor del 7 en 478,209?',a:70000,opts:[700,7000,70000,700000],hint:'Count places from the right. / Cuenta las posiciones desde la derecha.',why:'7 is in the ten-thousands place. / El 7 está en las decenas de millar.'},{q:'Value of 3 in 63,415?',es:'¿Cuál es el valor del 3 en 63,415?',a:3000,opts:[30,300,3000,30000],hint:'63 thousand = 60 thousand + 3 thousand. / 63 mil = 60 mil + 3 mil.',why:'3 × 1,000 = 3,000.'},{q:'Value of 9 in 912,456?',es:'¿Cuál es el valor del 9 en 912,456?',a:900000,opts:[900,9000,90000,900000],hint:'The 9 is the first digit in a six-digit number. / El 9 está en las centenas de millar.',why:'9 × 100,000 = 900,000.'},{q:'Value of 8 in 248,165?',es:'¿Cuál es el valor del 8 en 248,165?',a:8000,opts:[80,800,8000,80000],hint:'The 8 is in the thousands place. / El 8 está en los millares.',why:'8 × 1,000 = 8,000.'}],round:[{q:'Round 347,821 to the nearest 100,000.',es:'Redondea 347,821 a la centena de millar más cercana.',a:300000,opts:[300000,350000,400000,340000],hint:'Look at the ten-thousands digit: 4. / Mira la cifra de las decenas de millar: 4.',why:'4 is less than 5, so round down to 300,000. / Como 4 es menor que 5, redondea a 300,000.'},{q:'Round 568,210 to the nearest 100,000.',es:'Redondea 568,210 a la centena de millar más cercana.',a:600000,opts:[500000,560000,600000,570000],hint:'The ten-thousands digit is 6. / La cifra de las decenas de millar es 6.',why:'6 is at least 5, so round up. / 6 es mayor o igual que 5, así que redondea hacia arriba.'},{q:'Round 42,671 to the nearest 1,000.',es:'Redondea 42,671 al millar más cercano.',a:43000,opts:[42000,42600,43000,50000],hint:'Check the hundreds digit: 6. / Mira la cifra de las centenas: 6.',why:'42,671 rounds to 43,000. / 42,671 se redondea a 43,000.'},{q:'Round 81,249 to the nearest 100.',es:'Redondea 81,249 a la centena más cercana.',a:81200,opts:[81000,81200,81300,82000],hint:'Check the tens digit: 4. / Mira la cifra de las decenas: 4.',why:'4 is less than 5, so 81,200. / 4 es menor que 5: 81,200.'},{q:'Round 735,999 to the nearest 10,000.',es:'Redondea 735,999 a la decena de millar más cercana.',a:740000,opts:[730000,735000,740000,800000],hint:'Check the thousands digit: 5. / Mira la cifra de los millares: 5.',why:'Round up to 740,000. / Redondea hacia arriba a 740,000.'}]};
let kind='',index=0,earned=0,answered=false,correctFirst=false;let total=0;try{total=Number(localStorage.getItem('capy-stars')||0)}catch(e){}const $=id=>document.getElementById(id);const format=n=>Number(n).toLocaleString('en-US');function stars(){$('stars').textContent='⭐ '+total+' stars'}function show(id){['home','game','finish'].forEach(s=>$(s).classList.toggle('hidden',s!==id))}function home(){show('home');stars()}quests.forEach(q=>{let b=document.createElement('button');b.className='quest';b.innerHTML='<span class="emoji">'+q.emoji+'</span><span><strong>'+q.name+'</strong><small>'+q.es+'<br>'+q.description+'</small></span><span class="arrow">→</span>';b.onclick=()=>start(q.kind);$('quests').appendChild(b)});function start(k){kind=k;index=0;earned=0;show('game');$('questName').textContent=quests.find(q=>q.kind===k).emoji+' '+quests.find(q=>q.kind===k).name;render()}function render(){answered=false;correctFirst=true;let q=questions[kind][index];$('step').textContent='Question '+(index+1)+' / '+questions[kind].length;$('sessionStars').textContent=earned;$('bar').style.width=(index/questions[kind].length*100)+'%';$('question').textContent=q.q;$('translation').textContent=q.es;$('face').textContent='🦫';$('message').classList.add('hidden');$('next').classList.add('hidden');$('hint').disabled=false;$('answers').innerHTML='';q.opts.forEach(n=>{let b=document.createElement('button');b.className='choice';b.textContent=format(n);b.onclick=()=>choose(n,b);$('answers').appendChild(b)})}function msg(t){$('message').textContent=t;$('message').classList.remove('hidden')}function choose(n,b){if(answered)return;let q=questions[kind][index];if(n!==q.a){correctFirst=false;b.classList.add('wrong');b.disabled=true;msg('Not quite! Try another answer. 💜 / ¡Casi! Inténtalo de nuevo.');$('face').textContent='🦫💭';return}answered=true;b.classList.add('correct');document.querySelectorAll('.choice').forEach(c=>c.disabled=true);if(correctFirst){earned++;total++;try{localStorage.setItem('capy-stars',String(total))}catch(e){}}stars();$('sessionStars').textContent=earned;msg('Great job! ⭐ ¡Muy bien! '+q.why);$('face').textContent='🦫🌟';$('hint').disabled=true;$('next').textContent=index===questions[kind].length-1?'Finish! 🏆':'Next → / Siguiente';$('next').classList.remove('hidden')}$('hint').onclick=()=>msg('💡 '+questions[kind][index].hint);$('next').onclick=()=>{index++;if(index>=questions[kind].length){$('bar').style.width='100%';$('result').textContent='You earned '+earned+' stars this quest! / ¡Ganaste '+earned+' estrellas en esta aventura!';show('finish')}else render()};$('back').onclick=home;$('again').onclick=home;stars();</script></body></html>
